output_dir: ~/flock/output-petals

dataset:
  class: Petals
  root: ~/flock/data/petals
  version: 0

model:
  class: Flock
  verbose: False
  test_samples: 16
  # random walk
  walk_num: 16
  walk_len: 128
  record_neighbors: False
  # refinements
  refinements: 6
  attention_scatter: True
  attention_scatter_n_heads: 4
  additive_refinement: True
  embed_only_first_refinement: False
  embedding_tying_across_refinements: False
  parameter_tying_across_refinements: False
  # sequence network
  net: gru
  hidden_dim: 64
  n_layers: 1
  dtype: float32

task:
  name: SyntheticDatasetExperiment

optimizer:
  class: AdamW
  lr: 5.0e-4

train:
  gpus: {{ gpus }}
  num_epoch: 5
  log_interval: 50
