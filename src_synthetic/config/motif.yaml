output_dir: ~/flock/output-petals

dataset:
  class: Petals
  root: ~/flock/data/petals
  version: 0

model:
  class: MOTIF
  relation_model:
    class: HCNet
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    aggregate_func: sum
    short_cut: yes
    use_triton: yes
  entity_model:
    class: IndNBFNet
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: distmult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
    use_triton: yes

task:
  name: SyntheticDatasetExperiment

optimizer:
  class: AdamW
  lr: 5.0e-4

train:
  gpus: {{ gpus }}
  num_epoch: 5
  log_interval: 50
